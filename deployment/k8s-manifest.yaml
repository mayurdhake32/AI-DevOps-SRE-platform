apiVersion: v1
kind: Namespace
metadata:
  name: ai-devops-sre
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-devops-sre
  namespace: ai-devops-sre
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-devops-sre
  template:
    metadata:
      labels:
        app: ai-devops-sre
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sre
          image: ai-devops-sre:latest
          ports:
            - containerPort: 8000
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sre-secrets
                  key: openai-api-key
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sre-secrets
                  key: github-token
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-devops-sre
  namespace: ai-devops-sre
spec:
  selector:
    app: ai-devops-sre
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: sre-secrets
  namespace: ai-devops-sre
type: Opaque
stringData:
  openai-api-key: "your-openai-key"
  github-token: "your-github-token"